name: Daily Crash Report

on:
  schedule:
    # 01:30 UTC = 08:30 Vietnam. GitHub may start scheduled jobs late.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize cloud reports; never terminate a report while it is sending Slack.
concurrency:
  group: crashlytics-cloud-report
  cancel-in-progress: false

jobs:
  report:
    if: vars.CLOUD_REPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SHEET_NAME: ${{ vars.SHEET_NAME || 'crashlystic' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TRACKING_SPREADSHEET_ID: ${{ vars.TRACKING_SPREADSHEET_ID || '1uz7VkvtZwHjk16luXoW66olcMtSZmG-Vp45xRimaOYU' }}
      TRACKING_SHEET_ID: ${{ vars.TRACKING_SHEET_ID || '555656315' }}
      FIREBASE_STORAGE_STATE: credentials/firebase-state.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore encrypted Firebase session and Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          FIREBASE_SESSION_KEY: ${{ secrets.FIREBASE_SESSION_KEY }}
        run: node scripts/prepare-cloud.js
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run report
        run: npm run report
      - name: Notify failure
        if: failure()
        run: node scripts/cloud-failure.js
      - name: Remove decrypted credentials
        if: always()
        run: node -e "require('node:fs').rmSync('credentials', { recursive:true, force:true })"
